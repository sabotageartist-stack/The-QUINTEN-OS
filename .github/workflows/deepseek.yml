
name: DeepSeek Code Generator Bridge

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Instructions or module to generate'
        required: true
        default: 'Generate app.py FastAPI entrypoint'
      filename:
        description: 'Target filename (e.g. app.py)'
        required: true
        default: 'app.py'

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Generator Script
        run: |
          cat << 'EOF' > generator.py
          import os
          import sys
          import json
          import urllib.request

          try:
              api_key = os.getenv('DEEPSEEK_API_KEY')
              prompt = os.getenv('PROMPT')
              filename = os.getenv('FILENAME')

              if not api_key:
                  print('ERROR: DEEPSEEK_API_KEY secret is missing.')
                  sys.exit(1)

              url = 'https://api.deepseek.com/v1/chat/completions'
              headers = {
                  'Content-Type': 'application/json',
                  'Authorization': f'Bearer {api_key}'
              }
              data = {
                  'model': 'deepseek-chat',
                  'messages': [
                      {'role': 'system', 'content': 'You are a senior backend engineer. Output ONLY clean, raw Python code with no markdown blocks or conversational wrapper text.'},
                      {'role': 'user', 'content': prompt}
                  ],
                  'temperature': 0.1
              }

              req = urllib.request.Request(url, data=json.dumps(data).encode('utf-8'), headers=headers, method='POST')
              with urllib.request.urlopen(req) as response:
                  res_json = json.loads(response.read().decode('utf-8'))
                  code_content = res_json['choices'][0]['message']['content']

              if code_content.startswith('```'):
                  lines = code_content.splitlines()
                  code_content = '\n'.join(lines[1:-1] if lines[-1].startswith('```') else lines[1:])

              with open(filename, 'w', encoding='utf-8') as f:
                  f.write(code_content)
              print(f'Successfully generated and wrote {filename}')
          except Exception as e:
              print(f'CRITICAL EXCEPTION: {e}')
              sys.exit(1)
          EOF

      - name: Run Generator & Commit
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROMPT: ${{ github.event.inputs.prompt }}
          FILENAME: ${{ github.event.inputs.filename }}
        run: |
          python generator.py
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ${{ github.event.inputs.filename }}
          git commit -m "Auto-generated ${{ github.event.inputs.filename }} via DeepSeek Bridge" || echo "No changes to commit"
          git push
