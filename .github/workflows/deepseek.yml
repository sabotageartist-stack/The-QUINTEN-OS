name: DeepSeek Engine Bridge

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai fastapi pydantic sqlalchemy uvicorn pytest

      - name: Run Engine Verification Test
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -c "
          import os, urllib.request, json
          api_key = os.getenv('DEEPSEEK_API_KEY')
          print('DeepSeek API Key loaded securely via GitHub Actions Secret. Length:', len(api_key) if api_key else 0)
          "
