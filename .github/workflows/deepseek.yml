name: DeepSeek Code Generator Bridge

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Instructions or module to generate'
        required: true
        default: 'Generate app.py FastAPI entrypoint'
      filename:
        description: 'Target filename (e.g. app.py)'
        required: true
        default: 'app.py'

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Call DeepSeek API & Write File
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROMPT: ${{ github.event.inputs.prompt }}
          FILENAME: ${{ github.event.inputs.filename }}
        run: |
          python -c "
          import os, urllib.request, json

          api_key = os.getenv('DEEPSEEK_API_KEY')
          prompt = os.getenv('PROMPT')
          filename = os.getenv('FILENAME')

          url = 'https://api.deepseek.com/v1/chat/completions'
          headers = {
              'Content-Type': 'application/json',
              'Authorization': f'Bearer {api_key}'
          }
          data = {
              'model': 'deepseek-chat',
              'messages': [
                  {'role': 'system', 'content': 'You are a senior backend engineer. Output ONLY clean, raw Python code with no markdown blocks or conversational wrapper text.'},
                  {'role': 'user', 'content': prompt}
              ],
              'temperature': 0.1
          }

          req = urllib.request.Request(url, data=json.dumps(data).encode('utf-8'), headers=headers, method='POST')
          with urllib.request.urlopen(req) as response:
              res_json = json.loads(response.read().decode('utf-8'))
              code_content = res_json['choices'][0]['message']['content']

          # Clean markdown code blocks if model included them
          if code_content.startswith('```'):
              code_content = '\n'.join(code_content.splitlines()[1:-1])

          with open(filename, 'w', encoding='utf-8') as f:
              f.write(code_content)
          print(f'Successfully generated and wrote {filename}')
          "

      - name: Commit and Push File
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ${{ github.event.inputs.filename }}
          git commit -m "Auto-generated ${{ github.event.inputs.filename }} via DeepSeek Bridge"
          git push
